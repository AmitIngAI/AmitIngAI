<svg xmlns="http://www.w3.org/2000/svg" width="420" height="380" viewBox="0 0 420 380">
  <style>
    .header { font-family: 'Fira Code', 'Courier New', monospace; font-size: 12px; fill: #8b949e; }
    .prompt { font-family: 'Fira Code', 'Courier New', monospace; font-size: 13px; fill: #3fb950; font-weight: bold; }
    .command { font-family: 'Fira Code', 'Courier New', monospace; font-size: 13px; fill: #58a6ff; }
    .text { font-family: 'Fira Code', 'Courier New', monospace; font-size: 12px; fill: #c9d1d9; }
    .accent { font-family: 'Fira Code', 'Courier New', monospace; font-size: 12px; fill: #f0883e; }
    .keyword { font-family: 'Fira Code', 'Courier New', monospace; font-size: 12px; fill: #d2a8ff; font-weight: bold; }
    .string { font-family: 'Fira Code', 'Courier New', monospace; font-size: 12px; fill: #a5d6ff; }
    .comment { font-family: 'Fira Code', 'Courier New', monospace; font-size: 11px; fill: #8b949e; font-style: italic; }
    .cursor { font-family: 'Fira Code', 'Courier New', monospace; font-size: 14px; fill: #58a6ff; animation: blink 1s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  </style>

  <!-- Background Card -->
  <rect width="420" height="380" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <!-- macOS Window Controls -->
  <circle cx="20" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="20" r="6" fill="#27c93f"/>
  <text x="85" y="24" class="header">AmitIngAI@github: ~$ cat config.js</text>
  <line x1="0" y1="40" x2="420" y2="40" stroke="#30363d" stroke-width="1"/>

  <!-- Terminal Executing Command -->
  <text x="20" y="68" class="prompt">➜ <tspan class="command">cat developer.config.js</tspan></text>

  <!-- Code Config Object -->
  <text x="20" y="98" class="keyword">const <tspan class="text">developer</tspan> = {</text>
  <text x="40" y="122" class="text">name: <tspan class="string">'Amit Kumar'</tspan>,</text>
  <text x="40" y="146" class="text">role: <tspan class="string">'Full Stack &amp; AI Engineer'</tspan>,</text>
  <text x="40" y="170" class="text">degree: <tspan class="string">'MCA Graduate'</tspan>,</text>
  <text x="40" y="194" class="text">specialties: [<tspan class="string">'Backend'</tspan>, <tspan class="string">'AI/ML'</tspan>],</text>
  <text x="40" y="218" class="text">topProjects: [<tspan class="string">'Bhoomi Seva'</tspan>, <tspan class="string">'MahaBenefit'</tspan>],</text>
  <text x="40" y="242" class="text">status: <tspan class="string">'Building Scalable Apps'</tspan>,</text>
  <text x="40" y="266" class="text">codeToCoffee: <tspan class="accent">true</tspan></text>
  <text x="20" y="290" class="keyword">};</text>

  <!-- System Output -->
  <text x="20" y="322" class="comment">// Executing system diagnostics...</text>
  <text x="20" y="344" class="prompt">✔ <tspan class="text" style="fill:#3fb950; font-weight:bold;">All AI &amp; Backend services operational</tspan></text>

  <!-- Dynamic Cursor -->
  <text x="20" y="368" class="prompt">AmitIngAI@github:~$ <tspan class="cursor">█</tspan></text>
</svg>
