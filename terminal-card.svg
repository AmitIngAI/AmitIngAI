<svg xmlns="http://www.w3.org/2000/svg" width="420" height="380" viewBox="0 0 420 380">
  <defs>
    <!-- Neon Ambient Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>

    <linearGradient id="neon-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#7c4dff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff4081" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="screen-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="420" height="380" rx="12" fill="url(#bg-grad)" stroke="#30363d" stroke-width="2"/>

  <!-- macOS Header -->
  <circle cx="20" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="20" r="6" fill="#27c93f"/>
  <text x="85" y="24" font-family="'Fira Code', monospace" font-size="12" fill="#8b949e">AmitIngAI@github: ~/workspace</text>
  <line x1="0" y1="40" x2="420" y2="40" stroke="#30363d" stroke-width="1"/>

  <!-- Glowing Ambient Ambient Light Bar -->
  <rect x="30" y="55" width="360" height="3" fill="url(#neon-glow)" filter="url(#glow)"/>

  <!-- Developer Workstation Illustration -->
  <!-- Left & Right Monitors -->
  <rect x="40" y="80" width="100" height="130" rx="6" fill="url(#screen-glow)" stroke="#374151" stroke-width="2"/>
  <rect x="280" y="80" width="100" height="130" rx="6" fill="url(#screen-glow)" stroke="#374151" stroke-width="2"/>
  
  <!-- Left Screen Code Lines -->
  <line x1="50" y1="95" x2="110" y2="95" stroke="#3fb950" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="108" x2="125" y2="108" stroke="#58a6ff" stroke-width="2" stroke-linecap="round"/>
  <line x1="60" y1="121" x2="115" y2="121" stroke="#d2a8ff" stroke-width="2" stroke-linecap="round"/>
  <line x1="60" y1="134" x2="100" y2="134" stroke="#f0883e" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="147" x2="120" y2="147" stroke="#58a6ff" stroke-width="2" stroke-linecap="round"/>

  <!-- Right Screen Analytics Chart -->
  <path d="M 295 180 L 315 150 L 335 165 L 355 120 L 370 135" fill="none" stroke="#00e5ff" stroke-width="2" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="355" cy="120" r="3" fill="#00e5ff"/>

  <!-- Center Laptop Screen -->
  <rect x="135" y="110" width="150" height="100" rx="6" fill="#030712" stroke="#4b5563" stroke-width="2"/>
  <!-- Glowing React / Node Code on Center Screen -->
  <text x="145" y="130" font-family="monospace" font-size="10" fill="#38bdf8">&lt;AmitKumar /&gt;</text>
  <line x1="145" y1="145" x2="250" y2="145" stroke="#4ade80" stroke-width="2" stroke-linecap="round"/>
  <line x1="155" y1="157" x2="235" y2="157" fill="none" stroke="#f43f5e" stroke-width="2" stroke-linecap="round"/>
  <line x1="155" y1="169" x2="210" y2="169" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  <text x="145" y="195" font-family="monospace" font-size="9" fill="#9ca3af">AI Engine: ONLINE</text>

  <!-- Male Developer Silhouette Vector -->
  <!-- Head & Hair -->
  <path d="M 190 220 Q 210 200 230 220 L 235 245 Q 210 255 185 245 Z" fill="#1f2937"/>
  <circle cx="210" cy="225" r="16" fill="#374151"/> <!-- Head -->
  <!-- Headphones -->
  <path d="M 191 223 C 191 205, 229 205, 229 223" fill="none" stroke="#00e5ff" stroke-width="4" stroke-linecap="round"/>
  <rect x="189" y="218" width="5" height="12" rx="2" fill="#7c4dff"/>
  <rect x="226" y="218" width="5" height="12" rx="2" fill="#7c4dff"/>

  <!-- Developer Hoodie / Shoulders -->
  <path d="M 165 285 Q 210 245 255 285 L 270 320 L 150 320 Z" fill="#111827" stroke="#1f2937" stroke-width="2"/>
  <path d="M 200 260 L 210 280 L 220 260" fill="none" stroke="#00e5ff" stroke-width="2"/> <!-- Hoodie String/Detail -->

  <!-- Desk Surface -->
  <rect x="20" y="315" width="380" height="6" rx="3" fill="#374151"/>

  <!-- Bottom Command Footer -->
  <text x="20" y="352" font-family="'Fira Code', monospace" font-size="12" fill="#3fb950" font-weight="bold">➜ <tspan fill="#58a6ff">status</tspan> <tspan fill="#c9d1d9">--role</tspan></text>
  <text x="160" y="352" font-family="'Fira Code', monospace" font-size="12" fill="#e5c07b">"Full Stack &amp; AI Engineer"</text>
  <text x="20" y="368" font-family="'Fira Code', monospace" font-size="11" fill="#6b7280">// 100% Vector Render | Always Sharp</text>
</svg>
